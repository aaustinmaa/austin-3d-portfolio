<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notes to Austin</title>
<style>
  :root{color-scheme:dark;--bg:#080B18;--panel:#11152A;--edge:#262C4A;--text:#E4E8F4;--soft:#8FA0B6;--cyan:#78E6F0;--gold:#E2BE7A;--danger:#E58A9A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:22px;margin:0 0 4px} .lede{color:var(--soft);margin:0 0 20px}
  form.login{display:flex;gap:8px;margin-bottom:20px} form.login input{flex:1}
  input,textarea{width:100%;background:#0B0F20;color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  button{border:1px solid var(--edge);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  button.primary{background:var(--cyan);border-color:var(--cyan);color:#071318;font-weight:600}
  button.danger{color:var(--danger)}
  button:disabled{opacity:.5;cursor:wait}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap} .tabs button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
  .note{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
  .head{display:flex;justify-content:space-between;gap:12px;color:var(--soft);font-size:13px;flex-wrap:wrap} .head b{color:var(--text)}
  .msg{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .replied{color:var(--gold);font-size:13px}
  .empty,.status{color:var(--soft)}
</style>
</head>
<body>
<main>
  <h1>Notes to Austin</h1>
  <p class="lede">Publish a note to show it beneath the star for every visitor; keep it private to show it only to its writer. Replies appear under the note for whoever can see it.</p>
  <form class="login" id="login"><input id="token" type="password" placeholder="Admin token" autocomplete="current-password" aria-label="Admin token"><button class="primary" type="submit">Open</button></form>
  <div class="tabs" id="tabs" hidden></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script type="module" src="/src/notes-admin.js"></script>
</body>
</html>
