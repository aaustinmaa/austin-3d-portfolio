<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Austin's Sky Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed sunlit 3D valley; glass UI pinned to the edges — top bar, altitude gauge right, place card left, Oracle chat dock bottom centre. Single sunlit look by choice. */
:root{
  --sky:#F3D8C8;
  --glass:rgba(252,248,240,.80);
  --glass-strong:rgba(253,250,244,.94);
  --ink:#1F3B40;
  --ink-soft:#56706F;
  --gold:#B4842A;
  --gold-soft:#F2D28A;
  --jade:#2F7F72;
  --line:rgba(31,59,64,.14);
  --shadow:0 18px 40px -18px rgba(60,40,30,.45);
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px));
  --gxr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#world.dragging{cursor:grabbing}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top, 0px));padding-bottom:10px;padding-left:var(--gx);padding-right:var(--gxr);pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow)}
.brand .name{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand .role{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;gap:6px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:7px 14px;
  font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(47,127,114,.10)}
.btn.primary{background:var(--ink);color:#FBF6EC}
.btn.primary:hover{background:#2C5157}

/* altitude gauge */
.gauge{position:fixed;z-index:4;right:calc(var(--gxr) + 4px);top:50%;transform:translateY(-50%);height:min(52vh,420px);width:150px;pointer-events:none}
.gauge-track{position:absolute;right:0;top:0;bottom:0;width:4px;border-radius:4px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(31,59,64,.08)}
.gauge-fill{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:linear-gradient(to top,var(--jade),var(--gold-soft))}
.gauge-dot{position:absolute;right:-6px;width:16px;height:16px;margin-bottom:-8px;border-radius:50%;background:#fff;border:3px solid var(--jade);box-shadow:0 0 0 4px rgba(255,255,255,.4)}
.gauge-ticks{list-style:none;margin:0;padding:0;position:absolute;inset:0}
.gauge-ticks li{position:absolute;right:12px;transform:translateY(50%);pointer-events:auto}
.gauge-ticks button{display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:3px 0;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink);text-shadow:0 1px 6px rgba(255,248,240,.95)}
.gauge-ticks button::after{content:"";width:10px;height:2px;background:var(--ink);opacity:.45}
.gauge-ticks button:hover{color:var(--jade)}
.gauge-ticks button.here{color:var(--jade);font-weight:500}
.gauge-ticks button.here::after{opacity:1;background:var(--jade);width:14px}
.gauge-read{position:absolute;right:-2px;bottom:-34px;font-family:var(--f-mono);font-size:11px;color:var(--ink);white-space:nowrap;text-shadow:0 1px 6px rgba(255,248,240,.95)}

/* place card */
.card{position:fixed;z-index:4;left:var(--gx);top:calc(84px + env(safe-area-inset-top, 0px));width:min(360px, calc(100% - 32px));
  background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);
  border-radius:20px;padding:20px 20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .kicker{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.card .gem{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;flex:none}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;text-wrap:balance}
.card .meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.card p{margin:0;line-height:1.55;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--f-mono);font-size:11px;padding:4px 8px;border-radius:6px;background:rgba(47,127,114,.09);color:#24605A}
.card .ask-about{align-self:flex-start;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.card .ask-about:hover{border-color:var(--jade);color:var(--jade)}

/* place labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;
  display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;padding:4px 6px;will-change:transform,opacity}
.plabel b{font-family:var(--f-display);font-weight:400;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(40,30,30,.55),0 0 14px rgba(40,30,30,.35);white-space:nowrap}
.plabel i{font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#FFF6E6;text-shadow:0 1px 3px rgba(40,30,30,.6);white-space:nowrap}

/* chat dock */
.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  width:min(640px, calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
.log{display:flex;flex-direction:column;gap:8px;max-height:min(30vh,240px);overflow-y:auto;scrollbar-width:thin;padding:2px;
  mask-image:linear-gradient(to bottom,transparent 0,#000 18px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px)}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.5;font-size:14.5px;box-shadow:0 8px 24px -14px rgba(60,40,30,.5)}
.msg.oracle{align-self:flex-start;background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-bottom-left-radius:4px}
.msg.oracle .who{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.msg.you{align-self:flex-end;background:var(--ink);color:#FBF6EC;border-bottom-right-radius:4px}
.msg .go{margin-top:8px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;background:var(--jade);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.msg .go:hover{background:#276C61}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid rgba(255,255,255,.8);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chips button:hover{background:var(--glass-strong);color:var(--jade)}
#ask{display:flex;align-items:center;gap:10px;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.orb{width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#FFF1C9 30%,#9FE3EA 75%,#6CC3CF 100%);
  box-shadow:0 0 0 3px rgba(242,210,138,.45),0 0 16px rgba(255,220,150,.9);animation:breathe 3.2s ease-in-out infinite}
.orb.busy{animation-duration:.8s}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(242,210,138,.25),0 0 26px rgba(255,220,150,1)}}
#q{flex:1;min-width:0;border:0;background:transparent;font-size:15px;padding:8px 0;outline:none}
#q::placeholder{color:#7D8F8D}
#ask button{border:0;border-radius:999px;background:var(--ink);color:#FBF6EC;padding:9px 18px;font-weight:600;cursor:pointer}
#ask button:hover{background:#2C5157}

.hint{position:fixed;z-index:3;left:var(--gx);bottom:calc(18px + env(safe-area-inset-bottom, 0px));font-family:var(--f-mono);font-size:11px;
  color:var(--ink);line-height:1.7;text-shadow:0 1px 6px rgba(255,248,240,.95);pointer-events:none}
.hint kbd{font-family:inherit;font-size:10.5px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.7);border:1px solid var(--line)}

/* all-work index */
.index{position:fixed;inset:0;z-index:8;background:rgba(40,52,56,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;
  padding-top:calc(72px + env(safe-area-inset-top, 0px));padding-bottom:24px;padding-left:var(--gx);padding-right:var(--gxr);overflow-y:auto}
.index-panel{width:min(560px,100%);background:var(--glass-strong);border-radius:22px;border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.index-panel header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.index-panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.index-panel ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.index-panel li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.index-panel li .alt{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);width:44px}
.index-panel li .t{min-width:0}
.index-panel li .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.index-panel li .t span{font-size:13px;color:var(--ink-soft)}
.index-panel li button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.index-panel li button:hover{border-color:var(--jade);color:var(--jade)}
.close{border:0;background:rgba(31,59,64,.08);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}

.toast{position:fixed;z-index:9;left:50%;top:calc(76px + env(safe-area-inset-top, 0px));transform:translateX(-50%);background:var(--ink);color:#FBF6EC;
  padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow)}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px var(--gxr) 24px var(--gx);font-size:16px;line-height:1.6}

@media (max-width:720px){
  .brand .role{display:none}
  .brand{padding:7px 14px}
  .brand .name{font-size:18px}
  .links{padding:3px}
  .btn{padding:6px 9px;font-size:12px}
  #allWork{display:none}
  .hint{display:none}
  .gauge{width:30px;height:min(34vh,260px);top:42%}
  .gauge-ticks button{font-size:0;gap:0}
  .gauge-ticks button::after{width:8px}
  .gauge-read{right:-4px}
  .card{top:auto;bottom:calc(150px + env(safe-area-inset-bottom, 0px));padding:16px;gap:8px;border-radius:18px}
  .card h2{font-size:24px}
  .card p{font-size:13.5px}
  .log{max-height:22vh}
  .msg{font-size:13.5px}
}
@media (max-width:720px) and (max-height:700px){ .card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden} }
@media (prefers-reduced-motion: reduce){ .orb,.card{animation:none} }
</style>

<canvas id="world" tabindex="0" aria-label="A floating sky garden. Walk the stone stairs to reach each project."></canvas>
<div id="labels"></div>

<header class="bar">
  <div class="brand"><span class="name">Austin Ma</span><span class="role">Software &amp; data engineering · Waterloo CS</span></div>
  <nav class="links" aria-label="Quick links">
    <button class="btn" id="allWork" type="button">All work</button>
    <a class="btn primary" href="#" data-placeholder="Résumé">Résumé</a>
    <a class="btn" href="https://github.com/aaustinmaa" target="_blank" rel="noopener">GitHub</a>
    <a class="btn" href="#" data-placeholder="LinkedIn">LinkedIn</a>
  </nav>
</header>

<aside class="gauge" aria-label="Altitude">
  <div class="gauge-track"><div class="gauge-fill" id="gFill"></div><div class="gauge-dot" id="gDot"></div></div>
  <ol class="gauge-ticks" id="gTicks"></ol>
  <div class="gauge-read">ALT <span id="alt">0</span> m</div>
</aside>

<article class="card" id="card" hidden aria-live="polite"></article>

<section class="dock" aria-label="Ask the Oracle">
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="ask" autocomplete="off">
    <span class="orb" id="orb" aria-hidden="true"></span>
    <input id="q" name="q" placeholder="Ask the Oracle about Austin…" aria-label="Ask the Oracle about Austin">
    <button type="submit">Ask</button>
  </form>
</section>

<div class="hint" id="hint"><kbd>W A S D</kbd> walk &nbsp;<kbd>Space</kbd> jump<br>drag to look · click anywhere to go</div>

<div class="index" id="index" hidden>
  <div class="index-panel" role="dialog" aria-label="All work">
    <header><h2>All work, bottom to top</h2><button class="close" id="closeIndex" type="button" aria-label="Close">×</button></header>
    <ol id="indexList"></ol>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend','<div class="fallback">The 3D garden could not load. Use the links above for the résumé, GitHub and LinkedIn.</div>'); return; }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = THREE.Vector3, UP = new V3(0,1,0);

/* ---------- seeded noise ---------- */
let seed = 7;
function rand(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function hash(x,y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ let t=0, a=.5, f=1; for (let i=0;i<4;i++){ t+=a*vnoise(x*f,y*f); f*=2; a*=.5; } return t/.9375; }
const sstep = (a,b,x) => { const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const lerp = (a,b,t) => a+(b-a)*t;

/* ---------- world constants ---------- */
const LAKE_R = 7.5, LAKE_BLOCK = 9.6, WORLD_R = 29.5, WATER_Y = -0.55;
const ORACLE_Y = 46;
const SP = { R:12.5, rise:.42, ang:.2, a0:.25, N:78, base:.5 };
const LANDINGS = [13,26,39,52,65,78];
function groundH(x,z){
  const r = Math.hypot(x,z);
  let h = (fbm(x*.07+3.1, z*.07+7.3) - .5) * 1.7;
  if (r < LAKE_R+3.2) h -= sstep(0,1,(LAKE_R+3.2-r)/3.2) * 2.6;
  if (r > 26) h += Math.min(Math.pow((r-26)/10,2)*6, 34);
  return h;
}
function spiralPt(i){ const a = SP.a0 + i*SP.ang; return { x:Math.sin(a)*SP.R, z:Math.cos(a)*SP.R, y:SP.base + i*SP.rise, a }; }

/* ---------- content ---------- */
const LM = [
  { id:'about', name:'Waterloo Grove', kicker:'Start here', color:'#7CC7B8', alt:0,
    title:'Austin Ma', meta:'Computer Science · University of Waterloo',
    body:'I build data pipelines and AI tools that people actually use. Everything I have made is on the stone stairs around the Oracle. Climb them, or ask it to carry you.',
    tags:['Python','TypeScript','Swift','Data engineering','AI apps'] },
  { id:'aquanow', name:'Aquanow', kicker:'Data Engineer Intern', color:'#E9B65C', landing:0,
    title:'Aquanow', meta:'May – Aug 2026 · Internship',
    body:'Built scheduled Python ingestion that syncs FX trades, balances and positions into Apache Iceberg tables on AWS, a PySpark/Glue raw-to-clean pipeline, and overnight-swap reports validated against statements.',
    tags:['Python','PySpark','AWS Glue','Iceberg','Athena','Terraform'] },
  { id:'nexo', name:'NEXO', kicker:'Research workspace · team project', color:'#9DB6F2', landing:1,
    title:'NEXO', meta:'Jul 2026 – Present',
    body:'A source-grounded research workspace for the humanities and social sciences. My part: the PDF viewer and annotation feature, and a sturdier data crawler with rate-limit backoff, target filtering and export reports.',
    tags:['PDF annotation','Crawler','Data pipelines'] },
  { id:'stablewake', name:'StableWake', kicker:'Mobile prototype · in progress', color:'#C7A6F0', landing:2,
    title:'StableWake', meta:'Prototype · 2026',
    body:'A sleep-and-wake prototype. The phone turns audio into short local summaries and throws the raw recording away, with an iOS AlarmKit alarm as a deadline backup.',
    tags:['React Native','Expo','TypeScript','Swift'] },
  { id:'suwudu', name:'SuWuDu', kicker:'Desktop pet & focus companion', color:'#F2A7B8', landing:3,
    title:'SuWuDu', meta:'Jul – Sep 2026',
    body:'A pixel pet that lives on your desktop and keeps you company while you focus, with focus and journal tracking and an AI chat that can see your screen. Native Swift on macOS, C#/WPF on Windows.',
    tags:['Swift','SwiftUI','AppKit','C#','WPF'] },
  { id:'watapply', name:'WatApply', kicker:'AI co-op application agent', color:'#6FD3C9', landing:4,
    title:'WatApply', meta:'Aug 2026 – Present',
    body:'A local AI app for Waterloo co-op applications. It finds evidence in your own materials, drafts tailored applications, and never submits anything without your exact approval.',
    tags:['LangGraph','FastAPI','React','PostgreSQL','pgvector'] },
  { id:'summit', name:'The Summit', kicker:'Skills & contact', color:'#FFD98A', landing:5,
    title:'Skills & contact', meta:'Highest landing · 33 m',
    body:'Languages: Python, TypeScript, Swift, C#, Java, SQL. Data: Spark, AWS Glue, Athena, Iceberg, Kafka. AI: LangGraph, LangChain, retrieval. The résumé, GitHub and LinkedIn links stay in the top bar the whole time.',
    tags:['Python','TypeScript','Swift','Spark','AWS','LangGraph'] },
];
const byId = Object.fromEntries(LM.map(l => [l.id, l]));

/* ---------- renderer ---------- */
const canvas = document.getElementById('world');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' }); }
catch(e){ document.body.insertAdjacentHTML('beforeend','<div class="fallback">This browser could not start WebGL. Use the links above for the résumé, GitHub and LinkedIn.</div>'); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xE8D2D2, 58, 230);
const camera = new THREE.PerspectiveCamera(58, 1, .1, 700);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.fov = w < h ? 70 : 58; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- textures ---------- */
function radialTex(stops, size=128){ const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2); stops.forEach(([o,col])=>gr.addColorStop(o,col)); g.fillStyle=gr; g.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(c); return t; }

function skipIntro(){ if (intro && intro.t < intro.dur - 1.1) intro.t = intro.dur - 1.1; }
const camPos = new V3(), lookAt = new V3(), wantPos = new V3(), wantLook = new V3();
function followPose(){
  const head = P.pos.clone().add(new V3(0,1.5,0)); const cp = Math.cos(camS.pitch);
  wantPos.set(Math.sin(camS.yaw)*cp, Math.sin(camS.pitch), Math.cos(camS.yaw)*cp).multiplyScalar(camS.dist).add(head);
  const hr = Math.hypot(wantPos.x, wantPos.z); if (hr > 38){ wantPos.x *= 38/hr; wantPos.z *= 38/hr; }
  wantPos.y = Math.max(wantPos.y, groundH(wantPos.x, wantPos.z) + .7);
  wantLook.copy(head).add(new V3(0, Math.max(0, .55 - camS.pitch)*4.5 + .6, 0));
}
followPose(); camPos.copy(intro ? intro.from : wantPos); lookAt.copy(intro ? intro.look : wantLook);
function updateCamera(dt){
  followPose();
  if (intro){
    intro.t += dt; const e = (x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2)(Math.min(1, Math.max(0,(intro.t-1.6)/(intro.dur-1.6))));

/* ---------- simulation ---------- */
function updatePlayer(dt){
  if (P.flight){
    const f = P.flight; f.t += dt/f.dur; const t = Math.min(1,f.t), e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const prev = P.pos.clone(); P.pos.lerpVectors(f.from, f.to, e); P.pos.y += Math.sin(Math.PI*e)*f.arc;
    const d = P.pos.clone().sub(prev); if (d.x*d.x+d.z*d.z > 1e-6) P.facing = Math.atan2(d.x, d.z);
    heroGlow.material.opacity = Math.sin(Math.PI*t)*.95;
    if (t >= 1){ P.flight = null; P.vel.set(0,0,0); P.onGround = true; heroGlow.material.opacity = 0; oracleState.target = 0; }
    P.speed = 0; return;
  }
  let mx = 0, mz = 0;
  const fwd = (keys.KeyW||keys.ArrowUp?1:0) - (keys.KeyS||keys.ArrowDown?1:0), side = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
  if (fwd || side){
    const fx = -Math.sin(camS.yaw), fz = -Math.cos(camS.yaw), rx = Math.cos(camS.yaw), rz = -Math.sin(camS.yaw);
    mx = fx*fwd + rx*side; mz = fz*fwd + rz*side; P.target = null;
  } else if (P.target){
    mx = P.target.x - P.pos.x; mz = P.target.z - P.pos.z; if (Math.hypot(mx,mz) < .25){ P.target = null; mx = mz = 0; }
  }
  const ml = Math.hypot(mx,mz); if (ml > 0){ mx/=ml; mz/=ml; }
  const k = 1 - Math.exp(-dt*(P.onGround ? 14 : 4));
  P.vel.x = lerp(P.vel.x, mx*SPEED, k); P.vel.z = lerp(P.vel.z, mz*SPEED, k);
  let nx = P.pos.x + P.vel.x*dt, nz = P.pos.z + P.vel.z*dt;
  const nr = Math.hypot(nx,nz);
  if (nr > WORLD_R){ nx *= WORLD_R/nr; nz *= WORLD_R/nr; }
  const sup0 = supportAt(nx, nz, P.pos.y);
  if (!sup0.onPlatform && P.pos.y < 2 && nr < LAKE_BLOCK){ const s = LAKE_BLOCK/Math.max(nr,.001); nx *= s; nz *= s; if (P.target) P.target = null; }
  P.vel.y -= GRAV*dt; let ny = P.pos.y + P.vel.y*dt;
  const sup = supportAt(nx, nz, P.pos.y);
  if (ny <= sup.h){ ny = sup.h; P.vel.y = 0; P.onGround = true; } else P.onGround = ny - sup.h < .05;
  P.pos.set(nx, ny, nz);
  const hs = Math.hypot(P.vel.x, P.vel.z); P.speed = hs;
  if (hs > .3){ const want = Math.atan2(P.vel.x, P.vel.z); let d = want - P.facing; d = Math.atan2(Math.sin(d), Math.cos(d)); P.facing += d*Math.min(1, dt*12); }
}
let T = 0;
function updateHero(dt){
  hero.position.copy(P.pos); hero.rotation.y = P.facing;
  const moving = Math.min(1, P.speed/SPEED); P.walk += dt*P.speed*1.9;
  const sw = Math.sin(P.walk)*.7*moving*(P.onGround?1:.2);
  legL.rotation.x = sw; legR.rotation.x = -sw;
  cloak.position.y = Math.abs(Math.sin(P.walk))*.05*moving; head.position.y = 1.47 + cloak.position.y; hair.position.y = 1.5 + cloak.position.y;
  if (P.flight){ legL.rotation.x = .5; legR.rotation.x = .1; }
  const stream = P.flight ? 1 : moving;
  tail.forEach((b,i) => { const k = i+1; b.position.set(Math.sin(T*7+i*.9)*.035*k*(.3+stream), 1.18 - k*(.035 + (1-stream)*.07), -.2 - k*(.06 + stream*.09)); b.rotation.set(-.25 + (1-stream)*.9, Math.sin(T*6+i)*.3, 0); });
  lanternGlow.material.opacity = .45 + Math.sin(T*3)*.12;
}
function updateWorld(dt){
  oracleState.energy = lerp(oracleState.energy, oracleState.target, 1 - Math.exp(-dt*3));
  const en = oracleState.energy;
  coreMat.uniforms.t.value = T; coreMat.uniforms.energy.value = en;
  core.rotation.y += dt*.18*(1+en*2); core.rotation.x = Math.sin(T*.3)*.25;
  innerCore.rotation.y -= dt*.25*(1+en*3); innerCore.rotation.z += dt*.1;
  oRings.forEach(r => { r.tor.rotation.z += dt*r.spd*.35*(1+en*3); });
  shards.forEach(o => { const a = o.ph + T*o.sp*(1+en*2); o.s.position.set(Math.cos(a)*o.r, Math.sin(a*1.3)*1.6 + Math.sin(a)*o.tilt*o.r*.3, Math.sin(a)*o.r); o.s.rotation.y += dt*2; });
  oracle.position.y = ORACLE_Y + Math.sin(T*.6)*.6;
  oHalo.material.opacity = .55 + Math.sin(T*1.4)*.06 + en*.2; oLight.intensity = .9 + en*.8;
  columnMat.uniforms.t.value = T; columnMat.uniforms.energy.value = en; lakeMat.uniforms.t.value = T; lakeMat.uniforms.energy.value = en; fallMat.uniforms.t.value = T;
  pointBeamMat.uniforms.t.value = T;
  if (beam.life > 0){ beam.life -= dt; pointBeamMat.uniforms.fade.value = Math.min(1, beam.life/1.2) * Math.min(1, (6-beam.life)/.4) * 2.4; if (beam.life <= 0) pointBeam.visible = false; }
  LM.forEach(l => { const act = (beam.life > 0 && beam.lm === l) || nearLm === l;
    l.gem.rotation.y += dt*1.2; l.gem.position.y = 3.6 + Math.sin(T*1.6 + l.alt)*.12;
    l.ring.material.opacity = lerp(l.ring.material.opacity, act ? .55 + Math.sin(T*4)*.15 : .2, 1 - Math.exp(-dt*5));
    l.halo.scale.setScalar(act ? 3.6 + Math.sin(T*4)*.3 : 2.6); });
  crystals.forEach((c,i) => { c.rotation.y += dt*.6; });
  islets.forEach(o => { o.grp.position.y = o.y + Math.sin(T*.5 + o.ph)*.5; o.grp.rotation.y += dt*.02; });
  clouds.forEach(c => { c.a += c.sp*dt; c.s.position.x = Math.sin(c.a)*c.d; c.s.position.z = Math.cos(c.a)*c.d; });
  mists.forEach((m,i) => { m.material.opacity = .45 + Math.sin(T*1.3+i)*.1; });
  if (!reduceMotion){
    const pp = petG.attributes.position.array;
    for (let i=0;i<PET;i++){ const v = petV[i]; pp[i*3+1] -= v[0]*dt*.6; pp[i*3] += Math.sin(T*v[2] + v[1])*dt*.5 + dt*.25; pp[i*3+2] += Math.cos(T*v[2]*.8 + v[1])*dt*.35;
      if (pp[i*3+1] < -.5){ pp[i*3+1] = 50 + rand()*8; const a = rand()*6.283, d = Math.sqrt(rand())*30; pp[i*3] = Math.sin(a)*d; pp[i*3+2] = Math.cos(a)*d; } }

    for (let i=0;i<MOTE;i++){ const d = moteD[i], a = d.ph + T*d.sp*(1+en*2.5); mp[i*3] = Math.cos(a)*d.r; mp[i*3+1] = d.y + Math.sin(a*2+d.ph)*.8; mp[i*3+2] = Math.sin(a)*d.r; }
    moteG.attributes.position.needsUpdate = true;
  }

}

  if (!found){ card.hidden = true; return; }
  card.innerHTML = `<div class="kicker"><span class="gem" style="background:${found.color}"></span>${found.kicker}</div>
    <h2>${found.title}</h2>${found.meta ? `<div class="meta">${found.meta}</div>` : ''}<p>${found.body}</p>
    <div class="tags">${found.tags.map(t => `<span>${t}</span>`).join('')}</div>
    <button class="ask-about" type="button">Ask the Oracle about this</button>`;
  card.querySelector('.ask-about').addEventListener('click', () => ask(found.id === 'about' ? 'Who is Austin?' : found.id === 'summit' ? 'What are his skills?' : `Tell me about ${found.name}`));
  card.hidden = false; card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
}

/* ---------- the Oracle's voice (scripted for the prototype) ---------- */
const INTENTS = [
  { k:['watapply','job agent','co-op compass','coop compass','waterlooworks','application agent'], to:'watapply',
    a:"WatApply is Austin's current build, started in August 2026. It's a local AI app for Waterloo co-op applications: it finds evidence in your own materials, drafts tailored applications and never submits without your exact approval. Under the hood it runs on LangGraph, FastAPI, React and PostgreSQL with pgvector. I've lit its landing for you." },
  { k:['suwudu','pixelheart','pet','pixel','focus'], to:'suwudu',
    a:"SuWuDu is a pixel pet that lives on your desktop and keeps you company while you focus. Austin built it natively twice, in Swift for macOS and C#/WPF for Windows, with focus tracking, a journal and an AI chat. Its island is the fourth landing." },
  { k:['stablewake','stable wake','sleep','alarm','wake'], to:'stablewake',
    a:"StableWake is a sleep-and-wake prototype Austin is still building. The phone summarizes audio locally and discards the raw recording, with an iOS alarm as a deadline backup. Third landing." },
  { k:['nexo','research','crawler','pdf'], to:'nexo',
    a:"NEXO is a team research workspace for the humanities and social sciences. Austin built its PDF viewer and annotations and made the data crawler sturdier. Second landing." },
  { k:['aquanow','intern','experience','job','实习','工作','data engineer','pipeline'], to:'aquanow',
    a:"Austin spent Summer 2026 at Aquanow as a Data Engineer Intern. He built Python and PySpark pipelines that land trades, balances and positions in Apache Iceberg on AWS, plus reports checked against real statements. First landing, just above the grove." },
  { k:['skill','stack','tech','language','know','技能','擅长'], to:'summit',
    a:"Day to day Austin writes Python, TypeScript and Swift, with C#, Java and SQL when needed. He's strongest in data pipelines (Spark, AWS Glue, Athena, Iceberg) and AI apps (LangGraph and retrieval). It's all written on the summit." },
  { k:['contact','hire','email','reach','linkedin','resume','résumé','cv','联系','简历'], to:'summit',
    a:"The quickest way is the top bar: the résumé, GitHub and LinkedIn are always up there. The summit has the same links if you'd rather walk." },
  { k:['project','built','build','made','portfolio','work','项目','做过'], to:'watapply',
    a:"Five pieces of Austin's work rest on these stairs. From the ground up: Aquanow, NEXO, StableWake, SuWuDu and WatApply. If you only visit one, make it WatApply." },
  { k:['summit','top','take me up','highest','fly'], to:'summit', a:"Hold on. The summit is the highest landing, thirty-three metres up." },
  { k:['waterloo','school','study','student','university','education','degree'], to:'about',
    a:"Austin studies Computer Science at the University of Waterloo. The grove at the foot of the stairs is where his story starts." },
  { k:['who','about','austin','yourself','介绍'], to:'about',
    a:"Austin Ma is a Computer Science student at Waterloo who builds data pipelines and AI tools. Everything he's made sits on the stairs around me. Ask me about any of it." },
  { k:['hello','hi','hey','你好','嗨'], to:null,
    a:"Hello, traveller. Ask me anything about Austin, or climb the stone stairs. Each landing holds a piece of his work." },
];
const FALLBACK = { to:null, a:"I only keep Austin's story up here. Try asking about his projects, his internship at Aquanow or his skills." };
function match(q){ const s = q.toLowerCase(); return INTENTS.find(it => it.k.some(k => /^[a-z ]+$/.test(k) && k.length <= 3 ? new RegExp(`\\b${k}\\b`).test(s) : s.includes(k))) || FALLBACK; }

const logEl = document.getElementById('log'), orb = document.getElementById('orb');
function addMsg(who, text){ const d = document.createElement('div'); d.className = 'msg ' + who; if (who === 'oracle') d.innerHTML = '<span class="who">The Oracle</span><span class="txt"></span>'; else d.textContent = text;
  logEl.appendChild(d); while (logEl.children.length > 8) logEl.firstChild.remove(); logEl.scrollTop = logEl.scrollHeight; return d; }
function oracleSay(text, l){
  const d = addMsg('oracle'); const span = d.querySelector('.txt'); oracleState.target = 1; orb.classList.add('busy');
  let i = 0; const done = () => { span.textContent = text; oracleState.target = P.flight ? 1 : 0; orb.classList.remove('busy');
    if (l){ const b = document.createElement('button'); b.className = 'go'; b.type = 'button'; b.textContent = l.id === 'about' ? 'Take me to the grove' : `Take me to ${l.name}`; b.addEventListener('click', () => goToLandmark(l)); d.appendChild(b); }
    logEl.scrollTop = logEl.scrollHeight; };
  if (reduceMotion){ done(); return; }
  const step = () => { i += 2 + Math.floor(Math.random()*2); span.textContent = text.slice(0,i); logEl.scrollTop = logEl.scrollHeight; if (i < text.length) setTimeout(step, 16); else done(); };
  setTimeout(step, 520);
}
function ask(q){ q = q.trim(); if (!q) return; addMsg('you', q); const it = match(q); const l = it.to ? byId[it.to] : null; if (l) setTimeout(() => beamTo(l), 420);
  if (l && /take me|fly|carry|go to|带我/.test(q.toLowerCase())) setTimeout(() => goToLandmark(l), 900);
  oracleSay(it.a, l); }
document.getElementById('ask').addEventListener('submit', e => { e.preventDefault(); const q = document.getElementById('q'); ask(q.value); q.value = ''; });
const chipsEl = document.getElementById('chips');
['What has he built?','Tell me about WatApply','His internship','Skills','How do I reach him?','Take me to the summit'].forEach(t => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.addEventListener('click', () => ask(t)); chipsEl.appendChild(b); });

/* ---------- index + links ---------- */
const indexEl = document.getElementById('index'), indexList = document.getElementById('indexList');
[...LM].reverse().forEach(l => { const li = document.createElement('li');
  li.innerHTML = `<span class="alt">${l.alt} m</span><span class="t"><b>${l.name}</b><span>${l.kicker}${l.meta && l.landing !== undefined ? ' · ' + l.meta : ''}</span></span>`;
  const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Fly there'; b.addEventListener('click', () => { indexEl.hidden = true; goToLandmark(l); }); li.appendChild(b); indexList.appendChild(li); });
document.getElementById('allWork').addEventListener('click', () => { indexEl.hidden = false; });
document.getElementById('closeIndex').addEventListener('click', () => { indexEl.hidden = true; });
indexEl.addEventListener('click', e => { if (e.target === indexEl) indexEl.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape') indexEl.hidden = true; });
const toast = document.getElementById('toast'); let toastT;
document.querySelectorAll('[data-placeholder]').forEach(a => a.addEventListener('click', e => { e.preventDefault();
  toast.textContent = `${a.dataset.placeholder} link goes here in the real site`; toast.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toast.hidden = true, 2200); }));

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; T += dt;
  updatePlayer(dt); updateHero(dt); updateNear(); updateCamera(dt); updateWorld(dt); updateLabels();
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => oracleSay("Welcome to Austin's sky garden. I keep his work on the stairs around me. Ask me anything, or start walking.", null), reduceMotion ? 200 : 1800);
})();
